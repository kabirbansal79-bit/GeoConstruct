
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX - Volume Construct</title>

    <style>
        body {
            margin: 0;
            padding: 25px 15px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            color: #60a5fa;
        }

        h2 {
            color: #93c5fd;
        }

        .panel {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
        }

        #objectImage {
            width: 260px;
            height: 220px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin: 15px auto;
        }

        .dimensions {
            background: #111827;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 450px;
            text-align: left;
        }

        input {
            display: block;
            width: 80%;
            max-width: 300px;
            padding: 12px;
            margin: 12px auto;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #feedback {
            font-weight: bold;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .progress {
            color: #93c5fd;
        }

        #nextButton,
        #completionSection,
        #piAnswerArea,
        #decimalAnswerArea,
        #rocketAnswerArea {
            display: none;
        }

        .missionKey {
            color: #facc15;
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>APEX ARCHITECTURE GROUP</h1>
    <h2>Volume Construct Training</h2>

    <p>
        Complete all four structure calculations to continue
        to the next stage of your mission.
    </p>

    <div class="panel">

        <p class="progress" id="progress">OBJECT 1 OF 4</p>

        <h2 id="objectTitle"></h2>

        <img id="objectImage" src="" alt="Structure image">

        <p id="objectDescription"></p>

        <div class="dimensions">
            <h3>Structure Measurements</h3>
            <div id="dimensionDetails"></div>
        </div>

        <p id="instructions"></p>

        <div id="answerSection">

            <div id="piAnswerArea">
                <input
                    type="number"
                    id="piAnswer"
                    step="any"
                    placeholder="Coefficient of π"
                >
            </div>

            <div id="decimalAnswerArea">
                <input
                    type="number"
                    id="decimalAnswer"
                    step="any"
                    placeholder="Enter the volume"
                >
            </div>

            <div id="rocketAnswerArea">
                <input
                    type="number"
                    id="rocketPiAnswer"
                    step="any"
                    placeholder="Coefficient of π"
                >

                <input
                    type="number"
                    id="rocketDecimalAnswer"
                    step="any"
                    placeholder="Volume of the fins"
                >
            </div>

            <button id="checkButton" onclick="checkAnswer()">
                Check Answer
            </button>

        </div>

        <p id="feedback"></p>

        <button id="nextButton" onclick="nextObject()">
            Next Object
        </button>

        <div id="completionSection">

            <h2>TRAINING COMPLETE</h2>

            <p>All four structures have been calculated successfully.</p>

            <p class="missionKey">The key is 11.</p>

            <button onclick="continueToSemifinal()">
                Proceed to Semifinal →
            </button>

        </div>

    </div>

</div>


<script>

    // IMAGES

    const imageLinks = {
        iceCream: "https://commons.wikimedia.org/wiki/Special:FilePath/Ice-cream.svg",

        house: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLrEjFCJvTeYxJ6MdUrhJypxV-8kpkXtdYblxo7jp4C5Gj_mADpeT6TOtt&s=10",

        popCan: "https://commons.wikimedia.org/wiki/Special:FilePath/Soft_Drink.svg",

        rocket: "https://as1.ftcdn.net/v2/jpg/02/37/96/12/1000_F_237961249_wepyvJn0CRDShRyY881yYUWdmNco3UJq.jpg"
    };


    // GAME VARIABLES

    const objects = ["iceCream", "house", "popCan", "rocket"];

    let currentIndex = 0;
    let correctPi = 0;
    let correctDecimal = 0;

    let savedConeRadius = 0;
    let savedConeHeight = 0;


    // RANDOM NUMBER FROM 3 TO 7

    function randomNumber() {
        return Math.floor(Math.random() * 5) + 3;
    }


    // SET UP A CHALLENGE

    function newChallenge() {

        const object = objects[currentIndex];

        document.getElementById("progress").textContent =
            "OBJECT " + (currentIndex + 1) + " OF 4";

        document.getElementById("feedback").textContent = "";
        document.getElementById("feedback").className = "";

        document.getElementById("nextButton").style.display = "none";
        document.getElementById("completionSection").style.display = "none";
        document.getElementById("answerSection").style.display = "block";
        document.getElementById("checkButton").disabled = false;

        document.getElementById("piAnswer").value = "";
        document.getElementById("decimalAnswer").value = "";
        document.getElementById("rocketPiAnswer").value = "";
        document.getElementById("rocketDecimalAnswer").value = "";

        document.getElementById("piAnswerArea").style.display = "none";
        document.getElementById("decimalAnswerArea").style.display = "none";
        document.getElementById("rocketAnswerArea").style.display = "none";

        document.getElementById("objectImage").src = imageLinks[object];


        // ICE CREAM: CONE + HEMISPHERE

        if (object === "iceCream") {

            const radius = randomNumber();
            const coneHeight = randomNumber();

            savedConeRadius = radius;
            savedConeHeight = coneHeight;

            correctPi =
                (radius * radius * coneHeight / 3) +
                (2 * Math.pow(radius, 3) / 3);

            correctDecimal = 0;

            setDetails(
                "Ice Cream Cone",
                "This structure consists of a cone with a hemisphere on top. Both have the same radius.",
                "Radius: " + radius + " units" +
                "<br>Cone height: " + coneHeight + " units",
                "Calculate the total volume. Enter only the coefficient of π."
            );

            document.getElementById("piAnswerArea").style.display = "block";
        }


        // HOUSE: CUBE + SQUARE PYRAMID

        else if (object === "house") {

            const side = randomNumber();
            const roofHeight = randomNumber();

            correctDecimal = Math.round(
                (
                    Math.pow(side, 3) +
                    Math.pow(side, 2) * roofHeight / 3
                ) * 100
            ) / 100;

            correctPi = 0;

            setDetails(
                "House",
                "This structure consists of a cube with a square pyramid on top.",
                "Cube side length: " + side + " units" +
                "<br>Pyramid height: " + roofHeight + " units",
                "Calculate the total volume and round your answer to 2 decimal places."
            );

            document.getElementById("decimalAnswerArea").style.display = "block";
        }


        // POP CAN: CYLINDER

        else if (object === "popCan") {

            const radius = randomNumber();
            const height = randomNumber();

            correctPi = radius * radius * height;
            correctDecimal = 0;

            setDetails(
                "Pop Can",
                "This structure is a cylinder.",
                "Radius: " + radius + " units" +
                "<br>Height: " + height + " units",
                "Calculate the volume. Enter only the coefficient of π."
            );

            document.getElementById("piAnswerArea").style.display = "block";
        }


        // ROCKET: CYLINDER + CONE + TWO FINS

        else if (object === "rocket") {

            const radius = randomNumber();
            const bodyHeight = randomNumber();
            const coneHeight = randomNumber();

            const finBase = randomNumber();
            const finHeight = randomNumber();
            const finDepth = randomNumber();

            correctPi =
                radius * radius * bodyHeight +
                radius * radius * coneHeight / 3;

            correctDecimal =
                finBase * finHeight * finDepth;

            setDetails(
                "Rocket Ship",
                "This structure consists of a cylinder, a cone, and two identical triangular prism fins.",
                "Body radius: " + radius + " units" +
                "<br>Body height: " + bodyHeight + " units" +
                "<br>Nose cone height: " + coneHeight + " units" +
                "<br>Each fin base: " + finBase + " units" +
                "<br>Each fin height: " + finHeight + " units" +
                "<br>Each fin depth: " + finDepth + " units",
                "Calculate the total volume. Enter the coefficient of π in the first box and the combined fin volume in the second box. Round the fin volume to 2 decimal places."
            );

            document.getElementById("rocketAnswerArea").style.display = "block";
        }

    }


    // DISPLAY OBJECT INFORMATION

    function setDetails(title, description, dimensions, instructions) {

        document.getElementById("objectTitle").textContent = title;
        document.getElementById("objectDescription").textContent = description;
        document.getElementById("dimensionDetails").innerHTML = dimensions;
        document.getElementById("instructions").textContent = instructions;

    }


    // CHECK ANSWERS

    function checkAnswer() {

        let correct = false;

        if (
            objects[currentIndex] === "iceCream" ||
            objects[currentIndex] === "popCan"
        ) {

            const input = document.getElementById("piAnswer").value;

            if (input.trim() === "") {
                alert("Please enter an answer.");
                return;
            }

            correct =
                Number.isFinite(Number(input)) &&
                Math.abs(Number(input) - correctPi) < 0.01;

        }


        else if (objects[currentIndex] === "house") {

            const input = document.getElementById("decimalAnswer").value;

            if (input.trim() === "") {
                alert("Please enter an answer.");
                return;
            }

            correct =
                Number.isFinite(Number(input)) &&
                Math.abs(Number(input) - correctDecimal) < 0.011;

        }


        else if (objects[currentIndex] === "rocket") {

            const piInput = document.getElementById("rocketPiAnswer").value;
            const finInput = document.getElementById("rocketDecimalAnswer").value;

            if (piInput.trim() === "" || finInput.trim() === "") {
                alert("Please complete both answer boxes.");
                return;
            }

            const piAnswer = Number(piInput);
            const finAnswer = Number(finInput);

            correct =
                Number.isFinite(piAnswer) &&
                Number.isFinite(finAnswer) &&
                Math.abs(piAnswer - correctPi) < 0.01 &&
                Math.abs(finAnswer - correctDecimal) < 0.011;

        }


        // CORRECT ANSWER

        if (correct) {

            document.getElementById("feedback").textContent =
                "Correct! Calculation verified.";

            document.getElementById("feedback").className = "success";

            document.getElementById("checkButton").disabled = true;
            document.getElementById("answerSection").style.display = "none";


            // LAST OBJECT COMPLETED

            if (currentIndex === 3) {

                localStorage.setItem("volumeConstructKey", "11");
                localStorage.setItem("coneRadius", savedConeRadius);
                localStorage.setItem("coneHeight", savedConeHeight);

                document.getElementById("completionSection").style.display = "block";

            } else {

                document.getElementById("nextButton").style.display = "inline-block";

            }

        } else {

            document.getElementById("feedback").textContent =
                "Incorrect. Review your calculations and try again.";

            document.getElementById("feedback").className = "error";

        }

    }


    // NEXT OBJECT

    function nextObject() {

        if (currentIndex < 3) {

            currentIndex++;

            newChallenge();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    }


    // GO TO SEMIFINAL

    function continueToSemifinal() {
        window.location.href = "semifinal.html";
    }


    // START

    newChallenge();

</script>

</body>
</html>
