
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Floor Plan Editor</title>

    <style>
        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px;
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3b82f6;
        }

        .workspace {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        canvas {
            background: #f8fafc;
            border: 2px solid #64748b;
            width: min(900px, 95vw);
            height: auto;
            cursor: grab;
            touch-action: none;
        }
    </style>
</head>

<body>

    <h1>2D Floor Plan Module</h1>

    <p>Design your floor plan using rectangles. Use the grid to position your shapes.</p>

    <div class="toolbar">

        <label for="generate_shape">Choose a shape to generate, either Circle, Rectangle, or Triangle:</label>
        <input id="generate_shape" type="text" placeholder="Enter shape type">
        <button onclick="generateShape()">Generate Shape</button>
        <br>
        <label for="3dheight">Enter 3D height (grid units):</label>
        <input id="3dheight" type="number" placeholder="Enter 3D height" min="1" value="10" step ="0.5">

        <script>

            function generateShape() {
                const shapeType = document.getElementById("generate_shape").value.trim().toLowerCase();

                if (shapeType === "rectangle") {
                    GenerateRectangle();
                } else if (shapeType === "circle") {
                    GenerateCircle();
                } else if (shapeType === "triangle") {
                    GenerateTriangle();
                } else {
                    alert("Invalid shape type. Please enter 'Rectangle', 'Circle', or 'Triangle'.");
                }
            }
        </script>


    </div>

    <div class="workspace">
        <canvas id="floor" width="900" height="600"></canvas>
    </div>

    <script>

        const canvas = document.getElementById("floor");
        const ctx = canvas.getContext("2d");

        const gridSize = 15;

        let walls = [];
        let rectangles = [];
        let triangles = [];
        let circles = [];

        
        let movingRectangle = false;
        let selectedRectangle = null;
        let lastPosition = null;


        function GenerateCircle() {

            const inputRadius = prompt(
                "Enter circle radius (grid units):",
                "10"
            );

            if (inputRadius === null) return;

            const radius = snap(parseFloat(inputRadius) * gridSize);

            const inputHeight = prompt(
                "Enter rectangle height (grid units):",
                "10"
            );

            if (inputHeight === null) return;

            const rectHeight = snap(parseFloat(inputHeight) * gridSize);

            if (
                !Number.isFinite(rectWidth) ||
                !Number.isFinite(rectHeight) ||
                rectWidth <= 0 ||
                rectHeight <= 0 ||
                rectWidth > canvas.width ||
                rectHeight > canvas.height
            ) {
                alert("Invalid dimensions");
                return;
            }

            const maxX = Math.floor(
                (canvas.width - rectWidth) / gridSize
            ) * gridSize;

            const maxY = Math.floor(
                (canvas.height - rectHeight) / gridSize
            ) * gridSize;

            const startX = snap(Math.random() * maxX);
            const startY = snap(Math.random() * maxY);

            const rectangleWalls = [
                {
                    start: { x: startX, y: startY },
                    end: { x: startX + rectWidth, y: startY }
                },
                {
                    start: { x: startX + rectWidth, y: startY },
                    end: { x: startX + rectWidth, y: startY + rectHeight }
                },
                {
                    start: { x: startX + rectWidth, y: startY + rectHeight },
                    end: { x: startX, y: startY + rectHeight }
                },
                {
                    start: { x: startX, y: startY + rectHeight },
                    end: { x: startX, y: startY }
                }
            ];

            const rectangle = {
                x: startX,
                y: startY,
                width: rectWidth,
                height: rectHeight,
                wallGroup: rectangleWalls
            };

            rectangles.push(rectangle);

            walls.push(...rectangleWalls);

            render();
        }
 function GenerateRectangle() {

            const inputWidth = prompt(
                "Enter rectangle width (grid units):",
                "10"
            );

            if (inputWidth === null) return;

            const rectWidth = snap(parseFloat(inputWidth) * gridSize);

            const inputHeight = prompt(
                "Enter rectangle height (grid units):",
                "10"
            );

            if (inputHeight === null) return;

            const rectHeight = snap(parseFloat(inputHeight) * gridSize);

            if (
                !Number.isFinite(rectWidth) ||
                !Number.isFinite(rectHeight) ||
                rectWidth <= 0 ||
                rectHeight <= 0 ||
                rectWidth > canvas.width ||
                rectHeight > canvas.height
            ) {
                alert("Invalid dimensions");
                return;
            }

            const maxX = Math.floor(
                (canvas.width - rectWidth) / gridSize
            ) * gridSize;

            const maxY = Math.floor(
                (canvas.height - rectHeight) / gridSize
            ) * gridSize;

            const startX = snap(Math.random() * maxX);
            const startY = snap(Math.random() * maxY);

            const rectangleWalls = [
                {
                    start: { x: startX, y: startY },
                    end: { x: startX + rectWidth, y: startY }
                },
                {
                    start: { x: startX + rectWidth, y: startY },
                    end: { x: startX + rectWidth, y: startY + rectHeight }
                },
                {
                    start: { x: startX + rectWidth, y: startY + rectHeight },
                    end: { x: startX, y: startY + rectHeight }
                },
                {
                    start: { x: startX, y: startY + rectHeight },
                    end: { x: startX, y: startY }
                }
            ];

            const rectangle = {
                x: startX,
                y: startY,
                width: rectWidth,
                height: rectHeight,
                wallGroup: rectangleWalls
            };

            rectangles.push(rectangle);

            walls.push(...rectangleWalls);

            render();
        }

        function drawGrid() {

            ctx.strokeStyle = "#d1d5db";
            ctx.lineWidth = 1;

            for (let x = 0; x <= canvas.width; x += gridSize) {

                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();

            }

            for (let y = 0; y <= canvas.height; y += gridSize) {

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();

            }
        }


        function snap(value) {

            return Math.round(value / gridSize) * gridSize;

        }


        function getPosition(event) {

            const rect = canvas.getBoundingClientRect();

            const x = (event.clientX - rect.left) *
                (canvas.width / rect.width);

            const y = (event.clientY - rect.top) *
                (canvas.height / rect.height);

            return {
                x: snap(x),
                y: snap(y)
            };
        }


        function drawWalls() {

            ctx.lineWidth = 6;
            ctx.lineCap = "square";

            walls.forEach(wall => {

                const isSelected = selectedRectangle &&
                    selectedRectangle.wallGroup.includes(wall);

                ctx.strokeStyle = isSelected
                    ? "#2563eb"
                    : "#1e293b";

                ctx.beginPath();

                ctx.moveTo(wall.start.x, wall.start.y);

                ctx.lineTo(wall.end.x, wall.end.y);

                ctx.stroke();

            });
        }
         function GenerateRectangle() {

            const inputWidth = prompt(
                "Enter rectangle width (grid units):",
                "10"
            );

            if (inputWidth === null) return;

            const rectWidth = snap(parseFloat(inputWidth) * gridSize);

            const inputHeight = prompt(
                "Enter rectangle height (grid units):",
                "10"
            );

            if (inputHeight === null) return;

            const rectHeight = snap(parseFloat(inputHeight) * gridSize);

            if (
                !Number.isFinite(rectWidth) ||
                !Number.isFinite(rectHeight) ||
                rectWidth <= 0 ||
                rectHeight <= 0 ||
                rectWidth > canvas.width ||
                rectHeight > canvas.height
            ) {
                alert("Invalid dimensions");
                return;
            }

            const maxX = Math.floor(
                (canvas.width - rectWidth) / gridSize
            ) * gridSize;

            const maxY = Math.floor(
                (canvas.height - rectHeight) / gridSize
            ) * gridSize;

            const startX = snap(Math.random() * maxX);
            const startY = snap(Math.random() * maxY);

            const rectangleWalls = [
                {
                    start: { x: startX, y: startY },
                    end: { x: startX + rectWidth, y: startY }
                },
                {
                    start: { x: startX + rectWidth, y: startY },
                    end: { x: startX + rectWidth, y: startY + rectHeight }
                },
                {
                    start: { x: startX + rectWidth, y: startY + rectHeight },
                    end: { x: startX, y: startY + rectHeight }
                },
                {
                    start: { x: startX, y: startY + rectHeight },
                    end: { x: startX, y: startY }
                }
            ];

            const rectangle = {
                x: startX,
                y: startY,
                width: rectWidth,
                height: rectHeight,
                wallGroup: rectangleWalls
            };

            rectangles.push(rectangle);

            walls.push(...rectangleWalls);

            render();
        }


        function render() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            drawWalls();

        }


        function findRectangle(position) {

            for (let i = rectangles.length - 1; i >= 0; i--) {

                const rectangle = rectangles[i];

                if (
                    position.x >= rectangle.x &&
                    position.x <= rectangle.x + rectangle.width &&
                    position.y >= rectangle.y &&
                    position.y <= rectangle.y + rectangle.height
                ) {
                    return rectangle;
                }
            }

            return null;
        }


        canvas.addEventListener("pointerdown", function(event) {

            const position = getPosition(event);

            const rectangle = findRectangle(position);

            if (rectangle) {

                selectedRectangle = rectangle;
                movingRectangle = true;
                lastPosition = position;

                canvas.setPointerCapture(event.pointerId);

                canvas.style.cursor = "grabbing";

                render();

            }

        });


        canvas.addEventListener("pointermove", function(event) {

            if (!movingRectangle || !selectedRectangle) return;

            const position = getPosition(event);

            const dx = position.x - lastPosition.x;
            const dy = position.y - lastPosition.y;

            const newX = selectedRectangle.x + dx;
            const newY = selectedRectangle.y + dy;

            if (
                newX >= 0 &&
                newY >= 0 &&
                newX + selectedRectangle.width <= canvas.width &&
                newY + selectedRectangle.height <= canvas.height
            ) {

                selectedRectangle.x = newX;
                selectedRectangle.y = newY;

                selectedRectangle.wallGroup.forEach(wall => {

                    wall.start.x += dx;
                    wall.start.y += dy;

                    wall.end.x += dx;
                    wall.end.y += dy;

                });

            }

            lastPosition = position;

            render();

        });


        canvas.addEventListener("pointerup", function() {

            movingRectangle = false;
            selectedRectangle = null;
            lastPosition = null;

            canvas.style.cursor = "grab";

            render();

        });


        canvas.addEventListener("pointercancel", function() {

            movingRectangle = false;
            selectedRectangle = null;
            lastPosition = null;

            canvas.style.cursor = "grab";

            render();

        });


        function clearFloor() {

            walls = [];
            rectangles = [];

            selectedRectangle = null;
            movingRectangle = false;

            render();

        }


        render();

    </script>

</body>
</html>
