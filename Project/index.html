
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Architecture Group</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(5, 12, 25, 0.7), rgba(5, 12, 25, 0.9)),
            url("https://images.unsplash.com/photo-1519501025264-65ba15a82390");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
        }

        .logo {
            color: #38bdf8;
            letter-spacing: 8px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(45px, 8vw, 85px);
            letter-spacing: 5px;
            margin: 0;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            letter-spacing: 3px;
            margin-top: 15px;
        }

        .line {
            width: 100px;
            height: 3px;
            background: #38bdf8;
            margin: 30px auto;
        }

        .description {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        button {
            background: #0284c7;
            color: white;
            border: 2px solid #38bdf8;
            padding: 16px 45px;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #38bdf8;
            color: #071426;
            box-shadow: 0 0 25px #38bdf8;
            transform: scale(1.05);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            color: #64748b;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">ISU ARTIFACT 1</div>

        <h1>CYLINDER CITY</h1>

        <div class="subtitle">AN INTERACTIVE EXPERIENCE</div>

        <div class="line"></div>

        <p class="description">
            The future of civilization depends on engineering.
            <br>
            One mission. One team. One chance to save the city.
        </p>

        <button onclick="window.location.href='Initialanimation.html'">
            START MISSION →
        </button>

    </div>

    <div class="footer">
        CLASSIFIED ENGINEERING DIVISION | YEAR 2070
    </div>

</body>
</html>
